<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Orders | NexMart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NEXMART</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link active" href="orders.html">Orders</a></li>
          <li class="nav-item">
            <a class="nav-link cart-link" href="cart.html">
              Cart <span id="cartCountBadge" class="cart-badge">0</span>
            </a>
          </li>
          <li class="nav-item" id="authNavArea"></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-top">
    <section class="section-padding">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">History</p>
          <h1>My Orders</h1>
        </div>

        <div id="ordersArea">
          <div class="loading-box">Loading orders...</div>
        </div>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container-custom"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

  <script>
    $(document).ready(async function () {
      updateNavbar();
      await updateCartBadge();

      if (!isLoggedIn()) {
        showToast('Please login to view orders.', 'error');

        setTimeout(function () {
          window.location.href = 'auth.html';
        }, 900);

        return;
      }

      await loadBackendOrders();
    });

    async function loadBackendOrders() {
      const response = await apiCall('/orders');

      if (!response.success) {
        $('#ordersArea').html(`<div class="error-box">${response.message || 'Failed to load orders.'}</div>`);
        return;
      }

      if (response.orders.length === 0) {
        $('#ordersArea').html(`
          <div class="empty-state">
            <h2>No orders yet</h2>
            <p>Your completed checkout orders will appear here.</p>
            <a href="products.html" class="btn primary-btn">Start Shopping</a>
          </div>
        `);
        return;
      }

      const ordersHtml = response.orders.map(function (order) {
        const itemsHtml = order.items.map(function (item) {
          return `
            <div class="order-item-row">
              <span>${item.name} × ${item.quantity}</span>
              <strong>${formatPrice(item.price * item.quantity)}</strong>
            </div>
          `;
        }).join('');

        return `
          <div class="order-card">
            <div class="order-header">
              <div>
                <p class="eyebrow mb-1">Order Number</p>
                <h2>${order.orderNumber}</h2>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <span class="stock-badge in">${order.paymentStatus}</span>
                <span class="stock-badge low">${order.orderStatus}</span>
              </div>
            </div>

            <div class="order-meta">
              <span>${formatDate(order.createdAt)}</span>
              <span>${order.shippingAddress.name}</span>
              <span>${order.shippingAddress.city}, ${order.shippingAddress.country}</span>
            </div>

            <div class="order-items-box">
              ${itemsHtml}
            </div>

            <div class="summary-row total">
              <span>Total</span>
              <strong>${formatPrice(order.totalAmount)}</strong>
            </div>
          </div>
        `;
      }).join('');

      $('#ordersArea').html(ordersHtml);
    }
  </script>
</body>
</html>
