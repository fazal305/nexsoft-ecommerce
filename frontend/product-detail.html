<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Detail | NexMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" />
  <meta name="description" content="View detailed product information, pricing, and ratings on NexMart." />
  <link rel="canonical" href="https://nexsoft-ecommerce.netlify.app/product-detail.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nexsoft-ecommerce.netlify.app/product-detail.html" />
  <meta property="og:title" content="Product Detail | NexMart" />
  <meta property="og:description" content="View detailed product information, pricing, and ratings on NexMart." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Product Detail | NexMart" />
  <meta name="twitter:description" content="View detailed product information, pricing, and ratings on NexMart." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NEXMART</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
          <li class="nav-item">
            <a class="nav-link cart-link" href="cart.html">
              Cart <span id="cartCountBadge" class="cart-badge">0</span>
            </a>
          </li>
          <li class="nav-item" id="authNavArea"></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-top">
    <section class="section-padding">
      <div class="container">
        <div id="productDetailArea">
          <div class="loading-box">Loading product details...</div>
        </div>

        <div class="section-heading mt-5">
          <p class="eyebrow">Related</p>
          <h2>Related Products</h2>
        </div>

        <div id="relatedProductsGrid" class="row g-4">
          <div class="col-12">
            <div class="loading-box">Loading related products...</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container-custom"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

  <script>
    let currentProduct = null;
    let selectedQuantity = 1;

    $(document).ready(function () {
      updateNavbar();
      updateCartBadge();
      loadProductDetail();
    });

    function getProductIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    async function loadProductDetail() {
      const productId = getProductIdFromUrl();

      if (!productId) {
        $('#productDetailArea').html('<div class="error-box">Product ID missing from URL.</div>');
        $('#relatedProductsGrid').html('');
        return;
      }

      const response = await apiCall(`/products/${productId}`);

      if (!response.success) {
        $('#productDetailArea').html('<div class="error-box">Product not found.</div>');
        $('#relatedProductsGrid').html('');
        return;
      }

      currentProduct = response.product;
      renderProductDetail(currentProduct);
      loadRelatedProducts(currentProduct.category, currentProduct._id);
    }

    function renderProductDetail(product) {
      const imageColor = product.images && product.images.length > 0 ? product.images[0] : '#00f5ff';
      const stockClass = getStockClass(product.stock);
      const stockText = getStockText(product.stock);
      const disabled = product.stock <= 0 ? 'disabled' : '';

      const originalPrice = product.originalPrice > product.price
        ? `<span class="original-price">${formatPrice(product.originalPrice)}</span>`
        : '';

      $('#productDetailArea').html(`
        <div class="product-detail-layout">
          <div class="detail-image" style="background:${imageColor};"></div>

          <div class="detail-content">
            <p class="product-category">${product.category}</p>
            <h1>${product.name}</h1>

            <div class="rating-row mb-3">
              ${buildStarRating(product.rating.average)}
              <span>${product.rating.average} / 5</span>
              <span>(${product.rating.count} reviews)</span>
            </div>

            <div class="price-row detail-price">
              <strong>${formatPrice(product.price)}</strong>
              ${originalPrice}
            </div>

            <span class="stock-badge ${stockClass}">${stockText}</span>

            <p class="detail-description">${product.description}</p>

            <div class="quantity-box">
              <button class="quantity-btn" onclick="decreaseQuantity()">-</button>
              <span id="quantityText">1</span>
              <button class="quantity-btn" onclick="increaseQuantity()">+</button>
            </div>

            <button class="btn primary-btn mt-4" ${disabled} onclick="addDetailProductToCart()">
              Add To Cart
            </button>

            <a href="products.html" class="btn ghost-btn mt-4 ms-2">Back To Products</a>
          </div>
        </div>
      `);
    }

    function getStockText(stock) {
      if (stock <= 0) {
        return 'Out of Stock';
      }

      if (stock < 5) {
        return 'Low Stock';
      }

      return 'In Stock';
    }

    function getStockClass(stock) {
      if (stock <= 0) {
        return 'out';
      }

      if (stock < 5) {
        return 'low';
      }

      return 'in';
    }

    function increaseQuantity() {
      if (!currentProduct) {
        return;
      }

      if (selectedQuantity >= currentProduct.stock) {
        showToast('You cannot add more than available stock.', 'error');
        return;
      }

      selectedQuantity += 1;
      $('#quantityText').text(selectedQuantity);
    }

    function decreaseQuantity() {
      if (selectedQuantity <= 1) {
        return;
      }

      selectedQuantity -= 1;
      $('#quantityText').text(selectedQuantity);
    }

    function addDetailProductToCart() {
      const imageColor = currentProduct.images && currentProduct.images.length > 0 ? currentProduct.images[0] : '#00f5ff';

      for (let count = 0; count < selectedQuantity; count++) {
       addProductToCart(currentProduct._id, currentProduct.name, currentProduct.price, imageColor);
      }
    }

    async function loadRelatedProducts(category, currentProductId) {
      const query = new URLSearchParams({
        category,
        limit: 4
      });

      const response = await apiCall(`/products?${query.toString()}`);

      if (!response.success) {
        $('#relatedProductsGrid').html('');
        return;
      }

      const relatedProducts = response.products.filter(function (product) {
        return product._id !== currentProductId;
      });

      if (relatedProducts.length === 0) {
        $('#relatedProductsGrid').html('<div class="col-12"><div class="loading-box">No related products found.</div></div>');
        return;
      }

      const cards = relatedProducts.map(function (product) {
        return buildProductCard(product);
      }).join('');

      $('#relatedProductsGrid').html(cards);
    }
  </script>
</body>
</html>
