<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Checkout | NexMart</title>
  <meta name="description" content="Complete a simulated checkout on NexMart, a full-stack ecommerce demo app." />
  <link rel="canonical" href="https://nexsoft-ecommerce.netlify.app/checkout.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nexsoft-ecommerce.netlify.app/checkout.html" />
  <meta property="og:title" content="Checkout | NexMart" />
  <meta property="og:description" content="Complete a simulated checkout on NexMart, a full-stack ecommerce demo app." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Checkout | NexMart" />
  <meta name="twitter:description" content="Complete a simulated checkout on NexMart, a full-stack ecommerce demo app." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NEXMART</a>
      <div id="authNavArea" class="ms-auto"></div>
    </div>
  </nav>

  <main class="page-top">
    <section class="section-padding">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Simulated Payment</p>
          <h1>Checkout</h1>
        </div>

        <div class="payment-warning">
          Simulated Payment — No real charge will happen.
        </div>

        <div class="row g-4 mt-2">
          <div class="col-lg-7">
            <form id="checkoutForm" class="checkout-panel">
              <h2>1. Shipping Address</h2>

              <input id="fullName" class="form-control app-input mb-3" placeholder="Full name" required>
              <input id="street" class="form-control app-input mb-3" placeholder="Street address" required>
              <input id="city" class="form-control app-input mb-3" placeholder="City" required>
              <input id="country" class="form-control app-input mb-3" placeholder="Country" required>
              <input id="phone" class="form-control app-input mb-4" placeholder="Phone number" required>

              <h2>2. Card Details</h2>

              <input id="cardNumber" class="form-control app-input mb-3" maxlength="19" placeholder="Card number" required>
              <input id="cardName" class="form-control app-input mb-3" placeholder="Name on card" required>

              <div class="row">
                <div class="col-md-6">
                  <input id="expiry" class="form-control app-input mb-3" maxlength="5" placeholder="MM/YY" required>
                </div>
                <div class="col-md-6">
                  <input id="cvv" class="form-control app-input mb-3" maxlength="3" placeholder="CVV" required>
                </div>
              </div>

              <button id="placeOrderButton" class="btn primary-btn w-100 mt-3" type="submit">
                Place Order
              </button>

              <div id="paymentMessage" class="payment-message"></div>
            </form>
          </div>

          <div class="col-lg-5">
            <div class="checkout-panel">
              <h2>3. Order Review</h2>
              <div id="checkoutItemsArea"></div>

              <div class="summary-row total mt-3">
                <span>Total</span>
                <strong id="checkoutTotalText">PKR 0</strong>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container-custom"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>

  <script>
    let checkoutCartItems = [];

    $(document).ready(async function () {
      updateNavbar();

      if (!isLoggedIn()) {
        showToast('Please login before checkout.', 'error');
        setTimeout(function () {
          window.location.href = 'auth.html';
        }, 900);
        return;
      }

      await renderCheckoutItems();

      $('#cardNumber').on('input', formatCardNumber);
      $('#expiry').on('input', formatExpiryDate);

      $('#checkoutForm').on('submit', function (event) {
        event.preventDefault();
        processSimulatedPayment();
      });
    });

    async function renderCheckoutItems() {
      const response = await apiCall('/cart');

      if (!response.success) {
        showToast(response.message || 'Failed to load cart.', 'error');
        return;
      }

      checkoutCartItems = response.cart.items || [];

      if (checkoutCartItems.length === 0) {
        window.location.href = 'cart.html';
        return;
      }

      const itemsHtml = checkoutCartItems.map(function (item) {
        return `
          <div class="checkout-item">
            <span>${item.name} × ${item.quantity}</span>
            <strong>${formatPrice(item.price * item.quantity)}</strong>
          </div>
        `;
      }).join('');

      const subtotal = checkoutCartItems.reduce(function (total, item) {
        return total + item.price * item.quantity;
      }, 0);

      const shipping = subtotal >= 10000 ? 0 : 300;
      const total = subtotal + shipping;

      $('#checkoutItemsArea').html(itemsHtml);
      $('#checkoutTotalText').text(formatPrice(total));
    }

    function formatCardNumber() {
      let value = $('#cardNumber').val().replace(/\D/g, '');
      value = value.substring(0, 16);
      value = value.replace(/(.{4})/g, '$1 ').trim();
      $('#cardNumber').val(value);
    }

    function formatExpiryDate() {
      let value = $('#expiry').val().replace(/\D/g, '');
      value = value.substring(0, 4);

      if (value.length >= 3) {
        value = `${value.substring(0, 2)}/${value.substring(2)}`;
      }

      $('#expiry').val(value);
    }

    function isValidExpiry(expiry) {
      const parts = expiry.split('/');

      if (parts.length !== 2) {
        return false;
      }

      const month = Number(parts[0]);
      const year = Number(`20${parts[1]}`);
      const now = new Date();
      const expiryDate = new Date(year, month);

      return month >= 1 && month <= 12 && expiryDate > now;
    }

    function validatePaymentForm() {
      const cardNumber = $('#cardNumber').val().replace(/\s/g, '');
      const expiry = $('#expiry').val();
      const cvv = $('#cvv').val();

      if (cardNumber.length !== 16) {
        showToast('Card number must be 16 digits.', 'error');
        return false;
      }

      if (!isValidExpiry(expiry)) {
        showToast('Expiry date must be valid and future.', 'error');
        return false;
      }

      if (!/^\d{3}$/.test(cvv)) {
        showToast('CVV must be 3 digits.', 'error');
        return false;
      }

      return true;
    }

    function processSimulatedPayment() {
      if (!validatePaymentForm()) {
        return;
      }

      $('#placeOrderButton').prop('disabled', true).text('Processing payment...');
      $('#paymentMessage').html('<div class="loading-box mt-3">Processing simulated payment...</div>');

      setTimeout(function () {
        const paymentSucceeded = Math.random() > 0.1;

        if (!paymentSucceeded) {
          $('#placeOrderButton').prop('disabled', false).text('Place Order');
          $('#paymentMessage').html('<div class="error-box mt-3">Payment declined. Please try again.</div>');
          return;
        }

        createBackendOrder();
      }, 2000);
    }

    async function createBackendOrder() {
      const orderPayload = {
        shippingAddress: {
          name: $('#fullName').val().trim(),
          street: $('#street').val().trim(),
          city: $('#city').val().trim(),
          country: $('#country').val().trim(),
          phone: $('#phone').val().trim()
        },
        paymentStatus: 'paid'
      };

      const response = await apiCall('/orders', 'POST', orderPayload);

      if (!response.success) {
        $('#placeOrderButton').prop('disabled', false).text('Place Order');
        $('#paymentMessage').html(`<div class="error-box mt-3">${response.message || 'Order failed.'}</div>`);
        return;
      }

      await updateCartBadge();

      $('#paymentMessage').html(`
        <div class="success-box mt-3">
          <h3>Order Placed Successfully!</h3>
          <p>Your order number is <strong>${response.order.orderNumber}</strong>.</p>
          <a href="orders.html" class="btn primary-btn mt-2">View Orders</a>
        </div>
      `);
    }
  </script>
</body>
</html>
