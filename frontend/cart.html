<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Cart | NexMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap" />
  <meta name="description" content="Review the items in your NexMart shopping cart before checkout." />
  <link rel="canonical" href="https://nexsoft-ecommerce.netlify.app/cart.html" />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://nexsoft-ecommerce.netlify.app/cart.html" />
  <meta property="og:title" content="Cart | NexMart" />
  <meta property="og:description" content="Review the items in your NexMart shopping cart before checkout." />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cart | NexMart" />
  <meta name="twitter:description" content="Review the items in your NexMart shopping cart before checkout." />

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark app-navbar fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NEXMART</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
          <li class="nav-item"><a class="nav-link" href="orders.html">Orders</a></li>
          <li class="nav-item">
            <a class="nav-link cart-link active" href="cart.html">
              Cart <span id="cartCountBadge" class="cart-badge">0</span>
            </a>
          </li>
          <li class="nav-item" id="authNavArea"></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="page-top">
    <section class="section-padding">
      <div class="container">
        <div class="section-heading">
          <p class="eyebrow">Shopping Cart</p>
          <h1>Your Cart</h1>
        </div>

        <div class="row g-4">
          <div class="col-lg-8">
            <div id="cartItemsArea">
              <div class="loading-box">Loading cart...</div>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="cart-summary">
              <h2>Order Summary</h2>

              <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subtotalText">PKR 0</strong>
              </div>

              <div class="summary-row">
                <span>Shipping</span>
                <strong id="shippingText">PKR 0</strong>
              </div>

              <div class="summary-row total">
                <span>Total</span>
                <strong id="totalText">PKR 0</strong>
              </div>

              <p class="summary-note">Free shipping on orders above PKR 10,000.</p>

              <a id="checkoutButton" href="checkout.html" class="btn primary-btn w-100 mt-3">Proceed To Checkout</a>
              <a href="products.html" class="btn ghost-btn w-100 mt-3">Continue Shopping</a>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toastContainer" class="toast-container-custom"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>

  <script>
    let activeCartItems = [];

    $(document).ready(async function () {
      updateNavbar();
      await updateCartBadge();
      await renderCartPage();
    });

    async function getActiveCartItems() {
      if (!isLoggedIn()) {
        return getGuestCart();
      }

      const response = await apiCall('/cart');

      if (!response.success) {
        showToast(response.message || 'Failed to load cart.', 'error');
        return [];
      }

      return response.cart.items || [];
    }

    async function renderCartPage() {
      activeCartItems = await getActiveCartItems();

      if (activeCartItems.length === 0) {
        $('#cartItemsArea').html(`
          <div class="empty-state">
            <h2>Your cart is empty</h2>
            <p>Add some products first, then come back here to checkout.</p>
            <a href="products.html" class="btn primary-btn">Browse Products</a>
          </div>
        `);

        $('#checkoutButton').addClass('disabled');
        updateSummary(0);
        return;
      }

      const cartItems = activeCartItems.map(function (item) {
        return `
          <div class="cart-item">
            <div class="cart-item-image" style="background:${item.image};"></div>

            <div class="cart-item-info">
              <h3>${item.name}</h3>
              <p>${formatPrice(item.price)}</p>
            </div>

            <div class="cart-quantity">
              <button onclick="decreaseCartItem('${item.productId}')">-</button>
              <span>${item.quantity}</span>
              <button onclick="increaseCartItem('${item.productId}')">+</button>
            </div>

            <div class="cart-subtotal">
              <strong>${formatPrice(item.price * item.quantity)}</strong>
              <button onclick="removeCartItem('${item.productId}')">Remove</button>
            </div>
          </div>
        `;
      }).join('');

      $('#cartItemsArea').html(cartItems);
      $('#checkoutButton').removeClass('disabled');

      const subtotal = activeCartItems.reduce(function (total, item) {
        return total + item.price * item.quantity;
      }, 0);

      updateSummary(subtotal);
    }

    function updateSummary(subtotal) {
      const shipping = subtotal === 0 || subtotal >= 10000 ? 0 : 300;
      const total = subtotal + shipping;

      $('#subtotalText').text(formatPrice(subtotal));
      $('#shippingText').text(shipping === 0 ? 'Free' : formatPrice(shipping));
      $('#totalText').text(formatPrice(total));
    }

    async function increaseCartItem(productId) {
      const item = activeCartItems.find(function (cartItem) {
        return cartItem.productId.toString() === productId.toString();
      });

      if (!item) {
        return;
      }

      await updateCartItemQuantity(productId, item.quantity + 1);
    }

    async function decreaseCartItem(productId) {
      const item = activeCartItems.find(function (cartItem) {
        return cartItem.productId.toString() === productId.toString();
      });

      if (!item) {
        return;
      }

      if (item.quantity <= 1) {
        await removeCartItem(productId);
        return;
      }

      await updateCartItemQuantity(productId, item.quantity - 1);
    }

    async function updateCartItemQuantity(productId, quantity) {
      if (isLoggedIn()) {
        const response = await apiCall('/cart/update', 'PUT', {
          productId,
          quantity
        });

        if (!response.success) {
          showToast(response.message || 'Failed to update cart.', 'error');
          return;
        }
      } else {
        const cart = getGuestCart();

        const item = cart.find(function (cartItem) {
          return cartItem.productId === productId;
        });

        if (item) {
          item.quantity = quantity;
        }

        saveGuestCart(cart);
      }

      await updateCartBadge();
      await renderCartPage();
    }

    async function removeCartItem(productId) {
      if (isLoggedIn()) {
        const response = await apiCall(`/cart/remove/${productId}`, 'DELETE');

        if (!response.success) {
          showToast(response.message || 'Failed to remove item.', 'error');
          return;
        }
      } else {
        const cart = getGuestCart();

        const updatedCart = cart.filter(function (item) {
          return item.productId !== productId;
        });

        saveGuestCart(updatedCart);
      }

      await updateCartBadge();
      await renderCartPage();
      showToast('Item removed from cart.', 'success');
    }
  </script>
</body>
</html>
